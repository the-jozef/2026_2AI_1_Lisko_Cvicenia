<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="display: flex; flex-direction: row;">
        <div style="background-color: yellow;">div1</div>
        <div style="background-color: green;">div2</div>
        <p>This is a paragraph</p>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 30px;">
        <div style="background-color: yellow; width: 100px;">div1</div>
        <div style="background-color: green; flex: 1;">div2</div>
    </div>

    <div>
        <div style="display: flex; flex-direction: row; margin-top: 30px; height: 200px; border-width: 1px; border-style: solid; border-color: grey; justify-content: space-between;">
        <div style="background-color: yellow; width: 100px; height: 200px;">div1</div>
        <div style="background-color: green; width: 500px;">div2</div>
        <div style="background-color: blue; width: 100px;">div2</div>

    </div>


</body>
